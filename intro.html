<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050607" />
<title>Pixel Records — Code Intro</title>
<style>
  :root{
    --bg:#050607;
    --text:#f3f1ec;
    --muted:#858b92;
    --amber:#ff8a18;
    --cyan:#58d7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{
    position:fixed;inset:auto 18px 18px 18px;z-index:3;
    display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
    pointer-events:none;color:rgba(243,241,236,.44);
    font:600 10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .hud b{color:rgba(255,138,24,.86);font-weight:600}
  .hud .right{text-align:right}
  .restart{
    position:fixed;top:18px;right:18px;z-index:4;
    appearance:none;border:1px solid rgba(255,255,255,.08);background:rgba(8,10,12,.46);
    backdrop-filter:blur(10px);color:rgba(243,241,236,.62);border-radius:999px;
    padding:9px 12px;cursor:pointer;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.12em;text-transform:uppercase;transition:150ms ease;
  }
  .restart:hover{border-color:rgba(255,138,24,.28);color:#fff}
  @media(max-width:640px){.hud{font-size:8px}.restart{font-size:9px}.hud .right{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Procedural Pixel Records intro animation"></canvas>
<button class="restart" id="restart" type="button">Replay</button>
<div class="hud" aria-hidden="true">
  <div><b>PIXEL RECORDS</b><br/>GENERATIVE SIGNAL / CANVAS 2D</div>
  <div class="right">NO VIDEO ASSETS<br/>MATH + CODE</div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const restartButton = document.getElementById('restart');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });

  const palette = {
    bg: '#050607',
    text: '#f3f1ec',
    amber: '#ff8a18',
    cyan: '#58d7ff'
  };

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let textTargets = [];
  let startTime = performance.now();
  let pointer = { x: 0, y: 0, active: false };
  let raf = 0;
  let seed = 1337;

  const LOOP_MS = 11200;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, x) {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function fract(x) { return x - Math.floor(x); }
  function noise1(x) { return fract(Math.sin(x * 12.9898 + 78.233) * 43758.5453); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTargets();
    buildParticles();
  }

  function wordmarkLayout() {
    const landscape = W / H > 1.05;
    const maxWidth = W * (landscape ? .74 : .84);
    const size = Math.min(landscape ? H * .16 : W * .16, 154);
    const twoLine = W < 720;
    return { maxWidth, size, twoLine };
  }

  function fitFont(text, baseSize, maxWidth) {
    let size = baseSize;
    octx.font = `800 ${size}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    while (octx.measureText(text).width > maxWidth && size > 24) {
      size -= 2;
      octx.font = `800 ${size}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    }
    return size;
  }

  function buildTargets() {
    off.width = Math.max(1, Math.floor(W));
    off.height = Math.max(1, Math.floor(H));
    octx.clearRect(0, 0, W, H);
    const { maxWidth, size: baseSize, twoLine } = wordmarkLayout();
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';

    if (twoLine) {
      const s1 = fitFont('PIXEL', baseSize * 1.15, maxWidth);
      const s2 = fitFont('RECORDS', baseSize * 1.0, maxWidth);
      octx.font = `800 ${s1}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      octx.fillText('PIXEL', W/2, H/2 - s1*.48);
      octx.font = `800 ${s2}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      octx.fillText('RECORDS', W/2, H/2 + s2*.48);
    } else {
      const fs = fitFont('PIXEL RECORDS', baseSize, maxWidth);
      octx.font = `800 ${fs}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      octx.fillText('PIXEL RECORDS', W/2, H/2);
    }

    const data = octx.getImageData(0, 0, W, H).data;
    const step = Math.max(4, Math.round(Math.min(W,H) / 180));
    const pts = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const a = data[(y * W + x) * 4 + 3];
        if (a > 130) pts.push({ x, y });
      }
    }
    // Keep particle count controlled on phones and very large monitors.
    const cap = clamp(Math.floor((W * H) / 1450), 720, 1900);
    textTargets = [];
    if (!pts.length) return;
    const stride = Math.max(1, Math.floor(pts.length / cap));
    for (let i = 0; i < pts.length && textTargets.length < cap; i += stride) {
      textTargets.push(pts[i]);
    }
  }

  function buildParticles() {
    seed = 1337;
    const count = Math.max(720, textTargets.length);
    particles = new Array(count);
    for (let i = 0; i < count; i++) {
      const ang = rand() * Math.PI * 2;
      const r = Math.pow(rand(), .52) * Math.min(W,H) * .48;
      const cx = W * .5;
      const cy = H * .5;
      const target = textTargets[i % Math.max(1,textTargets.length)] || {x:cx,y:cy};
      const colRoll = rand();
      particles[i] = {
        x: cx + Math.cos(ang) * r,
        y: cy + Math.sin(ang) * r * .7,
        px: 0,
        py: 0,
        vx: (rand()-.5)*.3,
        vy: (rand()-.5)*.3,
        tx: target.x,
        ty: target.y,
        z: rand(),
        size: .45 + rand()*1.3,
        col: colRoll < .075 ? 1 : (colRoll < .115 ? 2 : 0),
        seed: rand()*1000
      };
    }
  }

  function reset() {
    startTime = performance.now();
    pointer.active = false;
    buildParticles();
  }

  function phase(t) {
    return {
      init: smooth(0.0, 1.05, t),
      network: smooth(0.9, 2.7, t) * (1 - smooth(4.5, 5.8, t)),
      gather: smooth(3.0, 5.7, t),
      lock: smooth(5.2, 6.8, t),
      title: smooth(6.0, 7.3, t),
      hold: smooth(7.0, 8.1, t) * (1 - smooth(9.9, 11.1, t)),
      fade: smooth(10.0, 11.15, t)
    };
  }

  function drawBackground(t, p) {
    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, W, H);

    const g1 = ctx.createRadialGradient(W*.64,H*.35,0,W*.64,H*.35,Math.min(W,H)*.65);
    g1.addColorStop(0, `rgba(255,138,24,${0.035 + p.network*.055})`);
    g1.addColorStop(1, 'rgba(255,138,24,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0,0,W,H);

    const g2 = ctx.createRadialGradient(W*.28,H*.68,0,W*.28,H*.68,Math.min(W,H)*.5);
    g2.addColorStop(0, `rgba(88,215,255,${0.018 + p.network*.035})`);
    g2.addColorStop(1, 'rgba(88,215,255,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0,0,W,H);

    // Fine technical grid only while the system is assembling.
    const gridA = p.network * .16 * (1 - p.lock);
    if (gridA > .001) {
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${gridA})`;
      ctx.lineWidth = .5;
      const grid = Math.max(42, Math.round(Math.min(W,H)/10));
      const ox = (t*10) % grid;
      for (let x = -grid+ox; x < W+grid; x += grid) {
        ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
      }
      for (let y = 0; y < H; y += grid) {
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      }
      ctx.restore();
    }

    // Slowly moving scan line.
    const scanY = ((t * 74) % (H + 220)) - 110;
    const scan = ctx.createLinearGradient(0,scanY-90,0,scanY+90);
    scan.addColorStop(0,'rgba(255,255,255,0)');
    scan.addColorStop(.5,`rgba(255,255,255,${.016 + .025*p.network})`);
    scan.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = scan;
    ctx.fillRect(0,scanY-90,W,180);
  }

  const nodes = [
    [.18,.63,2],[.31,.24,2],[.50,.45,1],[.69,.22,2],[.83,.62,2],[.36,.78,1],[.65,.79,1]
  ];
  const links = [[0,2],[1,2],[2,3],[2,4],[2,5],[2,6],[5,6]];

  function drawNetwork(t,p) {
    const a = p.network * (1 - p.lock*.86);
    if (a < .002) return;
    const pts = nodes.map((n,i) => {
      const wob = Math.sin(t*.7 + i*1.37)*3;
      return {x:n[0]*W + wob, y:n[1]*H + Math.cos(t*.61+i)*2.5, c:n[2]};
    });

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<links.length;i++) {
      const [ai,bi] = links[i];
      const A=pts[ai],B=pts[bi];
      const cyan = (i%3===0);
      ctx.strokeStyle = cyan ? `rgba(88,215,255,${a*.22})` : `rgba(255,138,24,${a*.25})`;
      ctx.lineWidth = 1;
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();

      // Packet travelling along the connection.
      const q = fract(t*.18 + i*.17);
      const x = lerp(A.x,B.x,q), y = lerp(A.y,B.y,q);
      ctx.fillStyle = cyan ? `rgba(88,215,255,${a*.92})` : `rgba(255,138,24,${a*.95})`;
      ctx.beginPath();ctx.arc(x,y,1.8 + a*1.2,0,Math.PI*2);ctx.fill();
    }
    pts.forEach((pt,i) => {
      const color = pt.c===1 ? palette.amber : palette.cyan;
      ctx.shadowBlur = 18;ctx.shadowColor=color;ctx.fillStyle=color;
      ctx.globalAlpha = a*(i===2?1:.72);
      ctx.beginPath();ctx.arc(pt.x,pt.y,i===2?4.2:2.8,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();

    // Micro labels establish film / sound / system without becoming dashboard UI.
    if (W > 620) {
      const labels = ['PICTURE','MEMORY','SIRIUS','COLOR','MOTION','IMAGINE','MUSIC'];
      ctx.save();
      ctx.font = '600 9px ui-monospace,SFMono-Regular,Menlo,monospace';
      ctx.textAlign='center';ctx.textBaseline='top';
      pts.forEach((pt,i)=>{
        ctx.fillStyle=`rgba(243,241,236,${a*.36})`;
        ctx.fillText(labels[i],pt.x,pt.y+12);
      });
      ctx.restore();
    }
  }

  function updateAndDrawParticles(t,p) {
    const cx=W*.5, cy=H*.5;
    const gather = p.gather;
    const lock = p.lock;
    const fade = p.fade;
    const fieldStrength = 1 - gather;
    const pointerR = Math.min(W,H)*.28;

    ctx.save();
    ctx.globalCompositeOperation='lighter';

    for (let i=0;i<particles.length;i++) {
      const q=particles[i];
      q.px=q.x; q.py=q.y;

      if (gather < .98) {
        const dx=q.x-cx, dy=q.y-cy;
        const d=Math.sqrt(dx*dx+dy*dy)+.001;
        const tangentX=-dy/d, tangentY=dx/d;
        const wave=Math.sin(q.seed + t*1.4 + d*.012);
        q.vx += tangentX*(.005 + q.z*.018)*fieldStrength;
        q.vy += tangentY*(.005 + q.z*.018)*fieldStrength;
        q.vx += Math.cos(q.seed*2.1+t*.8)*.0025*fieldStrength;
        q.vy += Math.sin(q.seed*1.7+t*.9)*.0025*fieldStrength;
        q.vx += (-dx/d)*wave*.0016*fieldStrength;
        q.vy += (-dy/d)*wave*.0016*fieldStrength;
      }

      if (pointer.active && gather < .9) {
        const dx=q.x-pointer.x,dy=q.y-pointer.y;
        const d=Math.sqrt(dx*dx+dy*dy)+.01;
        if(d<pointerR){
          const f=(1-d/pointerR)*.016;
          q.vx += dx/d*f; q.vy += dy/d*f;
        }
      }

      if (gather > 0) {
        const spring = .004 + gather*.085;
        q.vx += (q.tx-q.x)*spring*gather;
        q.vy += (q.ty-q.y)*spring*gather;
        q.vx *= .88 - gather*.12;
        q.vy *= .88 - gather*.12;
      } else {
        q.vx*=.995;q.vy*=.995;
      }

      q.x+=q.vx; q.y+=q.vy;

      if (q.x < -40) q.x=W+40; else if(q.x>W+40) q.x=-40;
      if (q.y < -40) q.y=H+40; else if(q.y>H+40) q.y=-40;

      const alpha = clamp((.10 + p.init*.48 + gather*.34)*(1-fade),0,1);
      const color = q.col===1 ? [255,138,24] : q.col===2 ? [88,215,255] : [243,241,236];
      const localA = q.col===0 ? alpha*(.42 + q.z*.46) : alpha*(.62 + q.z*.38);
      ctx.strokeStyle=`rgba(${color[0]},${color[1]},${color[2]},${localA*.28})`;
      ctx.lineWidth=.55+q.z*.45;
      if(fieldStrength>.12){ctx.beginPath();ctx.moveTo(q.px,q.py);ctx.lineTo(q.x,q.y);ctx.stroke();}
      ctx.fillStyle=`rgba(${color[0]},${color[1]},${color[2]},${localA})`;
      const sz=q.size*(.65+lock*.45);
      ctx.fillRect(q.x-sz*.5,q.y-sz*.5,sz,sz);
    }
    ctx.restore();
  }

  function drawLogo(t,p) {
    const a = p.title * (1-p.fade);
    if (a < .001) return;

    const { maxWidth, size: baseSize, twoLine } = wordmarkLayout();
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha = a;

    // Crisp white wordmark only completes after particles have locked.
    const crisp = smooth(6.55,7.45,t);
    ctx.globalAlpha = a*crisp*.9;
    ctx.fillStyle=palette.text;
    if(twoLine){
      const s1 = fitFont('PIXEL',baseSize*1.15,maxWidth);
      const s2 = fitFont('RECORDS',baseSize,maxWidth);
      ctx.font=`800 ${s1}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      ctx.fillText('PIXEL',W/2,H/2-s1*.48);
      ctx.font=`800 ${s2}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      ctx.fillText('RECORDS',W/2,H/2+s2*.48);
    }else{
      const fs=fitFont('PIXEL RECORDS',baseSize,maxWidth);
      ctx.font=`800 ${fs}px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
      ctx.fillText('PIXEL RECORDS',W/2,H/2);
    }

    const y = twoLine ? H/2 + baseSize*1.45 : H/2 + baseSize*.82;
    ctx.globalAlpha=a*smooth(7.0,7.8,t)*.78;
    ctx.font=`600 ${Math.max(9,Math.min(14,W*.009))}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
    ctx.letterSpacing='0.16em';
    ctx.fillStyle='rgba(243,241,236,.72)';
    ctx.fillText('AI MULTIMEDIA PRODUCTION',W/2,y);

    // Pixel Records three-point signal mark.
    const markY = twoLine ? H/2-baseSize*1.55 : H/2-baseSize*.82;
    const r=Math.max(2.5,Math.min(5,W*.003));
    ctx.globalAlpha=a*smooth(6.75,7.5,t);
    for(let i=-1;i<=1;i++){
      ctx.fillStyle=i===0?palette.amber:'rgba(255,138,24,.62)';
      ctx.beginPath();ctx.arc(W/2+i*r*3.2,markY,r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawVignetteAndGrain(t) {
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    // deterministic sparse grain, low enough to remain elegant
    ctx.save();
    ctx.globalAlpha=.075;
    for(let i=0;i<Math.min(260,Math.floor(W*H/6000));i++){
      const x=noise1(i*7.3+t*.071)*W;
      const y=noise1(i*11.9+t*.093)*H;
      const v=noise1(i*17.1+t*.055)>.74 ? 255 : 120;
      ctx.fillStyle=`rgb(${v},${v},${v})`;
      ctx.fillRect(x,y,1,1);
    }
    ctx.restore();
  }

  function render(now) {
    let ms = now - startTime;
    if (!reduced && ms > LOOP_MS) {
      startTime = now;
      ms = 0;
      buildParticles();
    }
    const t = reduced ? 8.25 : ms/1000;
    const p = phase(t);

    drawBackground(t,p);
    drawNetwork(t,p);
    updateAndDrawParticles(t,p);
    drawLogo(t,p);
    drawVignetteAndGrain(t);

    raf=requestAnimationFrame(render);
  }

  canvas.addEventListener('pointermove', e => {
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;
  }, {passive:true});
  canvas.addEventListener('pointerleave',()=>pointer.active=false,{passive:true});
  canvas.addEventListener('pointerdown',()=>reset(),{passive:true});
  restartButton.addEventListener('click',reset);
  addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'||e.code==='Space'){e.preventDefault();reset();}});
  addEventListener('resize',resize,{passive:true});

  resize();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(render);
})();
</script>
</body>
</html>
